apiVersion: apps/v1
kind: Deployment

metadata:
  name: prescripto-deployment
  labels:
    app: prescripto

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prescripto

  template:
    metadata:
      labels:
        app: prescripto

    spec:
      containers:
      - name: prescripto

        image: prescripto
        imagePullPolicy: Never

        ports:
        - containerPort: 8000

        env:
        - name: DEBUG
          value: "false"

        - name: SECRET_KEY
          value: "mysecretkey"