apiVersion: apps/v1
kind: Deployment
metadata:
  name: prescripto-deployment
  labels:
    app: prescripto
spec:
  selector:
    matchLabels:
      app: prescripto
  replicas: 1
  template:
    metadata:
      labels:
        app: prescripto
    spec:
      containers:
      - name: prescripto
        image: huzaifa5/prescripto:v1
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "False"
        - name: SECRET_KEY
          value: "mysecretkey"
  